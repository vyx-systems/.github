name: governance-policy

on:
  pull_request:
    paths:
      - governance/**
      - tools/validate-governance.mjs
      - .github/workflows/governance.yml
  push:
    branches: [main]
    paths:
      - governance/**
      - tools/validate-governance.mjs
      - .github/workflows/governance.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541dca2d7c8b98b6b6d4f5fdb1a6d
        with:
          node-version: 22.14.0
      - run: node tools/validate-governance.mjs